name: marketplace

x-service: &service
  build:
    context: ..
    dockerfile: docker/Dockerfile
  environment: &service-env
    HTTP_PORT: 8080
    LOG_FORMAT: json
  depends_on:
    postgres:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
    interval: 10s
    timeout: 3s
    retries: 5
    start_period: 5s
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    container_name: marketplace-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marketplace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marketplace}
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marketplace} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: marketplace-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-helder}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-marketplace}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  catalog:
    <<: *service
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        SERVICE: catalog
    image: marketplace/catalog
    container_name: marketplace-catalog
    environment:
      <<: *service-env
      DATABASE_URL: postgres://${POSTGRES_USER:-marketplace}:${POSTGRES_PASSWORD:-marketplace}@postgres:5432/catalog
    ports:
      - "8081:8080"

  orders:
    <<: *service
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        SERVICE: orders
    image: marketplace/orders
    container_name: marketplace-orders
    environment:
      <<: *service-env
      DATABASE_URL: postgres://${POSTGRES_USER:-marketplace}:${POSTGRES_PASSWORD:-marketplace}@postgres:5432/orders
      CATALOG_URL: http://catalog:8080
      AMQP_URL: amqp://${RABBITMQ_USER:-helder}:${RABBITMQ_PASSWORD:-marketplace}@rabbitmq:5672/%2f
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
      catalog:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  inventory:
    <<: *service
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        SERVICE: inventory
    image: marketplace/inventory
    container_name: marketplace-inventory
    environment:
      <<: *service-env
      DATABASE_URL: postgres://${POSTGRES_USER:-marketplace}:${POSTGRES_PASSWORD:-marketplace}@postgres:5432/inventory
      AMQP_URL: amqp://${RABBITMQ_USER:-helder}:${RABBITMQ_PASSWORD:-marketplace}@rabbitmq:5672/%2f
    ports:
      - "8083:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  payments:
    <<: *service
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        SERVICE: payments
    image: marketplace/payments
    container_name: marketplace-payments
    environment:
      <<: *service-env
      DATABASE_URL: postgres://${POSTGRES_USER:-marketplace}:${POSTGRES_PASSWORD:-marketplace}@postgres:5432/payments
      AMQP_URL: amqp://${RABBITMQ_USER:-helder}:${RABBITMQ_PASSWORD:-marketplace}@rabbitmq:5672/%2f
    ports:
      - "8084:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  postgres-data:
  rabbitmq-data:
