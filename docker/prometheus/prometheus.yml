global:
  scrape_interval: 5s

scrape_configs:
  - job_name: catalog
    static_configs:
      - targets: ["catalog:8080"]

  - job_name: orders
    static_configs:
      - targets: ["orders:8080"]

  - job_name: inventory
    static_configs:
      - targets: ["inventory:8080"]

  - job_name: payments
    static_configs:
      - targets: ["payments:8080"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: rabbitmq
    metrics_path: /metrics/per-object
    static_configs:
      - targets: ["rabbitmq:15692"]
